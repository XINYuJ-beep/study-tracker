name: study_tracker
description: 学习打卡 App（纯本地离线 · 折叠屏适配）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 本地数据库（sqflite · 手写 SQL，无代码生成）
  sqflite: ^2.4.1

  # 数据库文件落盘路径
  path_provider: ^2.1.5
  path: ^1.9.1

  # 国际化 / 日期格式化
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.5.2
  intl: ^0.19.0

  # 图表
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/plan.json
    - assets/data/questions.json
    - assets/data/concepts.json
    - assets/data/stages.json
