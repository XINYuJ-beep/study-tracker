org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -Dkotlin.daemon.jvm.options=-Xmx1024m
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
kotlin.incremental=false
kotlin.daemon.useFallbackStrategy=true
# android.aapt2FromMavenOverride removed: build-tools aapt2 broken on aarch64 (35 too old, 36 Illegal instruction)
android.lint.checkTestSources=false
android.experimental.lint.missingBaselineIsEmptyBaseline=false
android.suppressUnsupportedCompileSdk=36

# 2026-10-30 disable resource optimize (OptimizeResourcesTask produces empty output on aarch64)
android.enableResourceOptimizations=false
