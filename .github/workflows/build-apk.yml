name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # 已切换到 sqflite：建表 SQL 与增删改查全部手写，
      # 全项目不再有任何代码生成步骤。
      - name: Confirm no code generation needed
        run: |
          echo "sqflite 版：无 .g.dart 依赖，跳过代码生成。"
          find lib -name '*.g.dart' | sort || true

      - name: Verify flutter.sdk path
        run: |
          test -f android/local.properties && cat android/local.properties

      # profile 包保留 Dart 侧 print 输出（release 会被 AOT 剥离），
      # 用于真机抓 [SEED]/[DB] 验收日志；release 包作为最终交付物。
      - name: Build profile APK (log-visible)
        run: flutter build apk --profile

      - name: Stash profile APK
        run: cp build/app/outputs/flutter-apk/app-profile.apk /tmp/app-profile.apk

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk-profile
          path: /tmp/app-profile.apk
          retention-days: 30
