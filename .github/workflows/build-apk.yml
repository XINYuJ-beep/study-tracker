name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # drift 的 .g.dart 不进仓库，由 build_runner 在 CI 里现场生成
      # timeout 2700：给 45 分钟。实测 2 核 runner 上 drift_dev 分析很慢
      # （52 个 action 跑到 14m42s 才 38 个），15 分钟必被误杀。
      - name: Generate drift code
        run: |
          set -x
          dart --version
          timeout 2700 dart run build_runner build --delete-conflicting-outputs --verbose

      - name: Show generated files
        if: always()
        run: find lib -name '*.g.dart' | sort

      # 验证 local.properties 已被 flutter 自动生成（无则报错暴露问题）
      - name: Verify flutter.sdk path
        run: test -f android/local.properties && cat android/local.properties

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30