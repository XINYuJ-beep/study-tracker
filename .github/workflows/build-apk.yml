name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # 全项目只有一个文件需要代码生成：lib/data/db/app_database.dart (part 'app_database.g.dart')
      # 第六轮实测：全量 build_runner 在 2 核 runner 上 44 分 46 秒后仍卡在 38/52，
      # 卡点正是 drift_dev 对 app_database.dart 的类型分析。
      # 改用 --build-filter 只跑这一个目标，跳过其余 51 个 action。
      - name: Generate drift code
        run: |
          set -x
          dart --version
          timeout 2700 dart run build_runner build \
            --build-filter="lib/data/db/app_database.g.dart" \
            --delete-conflicting-outputs \
            --verbose

      - name: Show generated files
        if: always()
        run: |
          find lib -name '*.g.dart' | sort
          ls -la lib/data/db/ || true

      - name: Verify flutter.sdk path
        run: |
          test -f android/local.properties && cat android/local.properties

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
