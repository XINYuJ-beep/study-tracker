name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # runner 磁盘约 14G，flutter + gradle + 三份 APK 会撑爆。
      # 先删掉构建完全用不到的预装大件，全部容错（|| true），路径不存在也不失败。
      - name: Free disk space before build
        run: |
          echo "--- disk BEFORE ---"
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo docker image prune -af || true
          echo "--- disk AFTER ---"
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # 已切换到 sqflite：建表 SQL 与增删改查全部手写，
      # 全项目不再有任何代码生成步骤。
      - name: Confirm no code generation needed
        run: |
          echo "sqflite 版：无 .g.dart 依赖，跳过代码生成。"
          find lib -name '*.g.dart' | sort || true

      - name: Verify flutter.sdk path
        run: |
          if [ -f android/local.properties ]; then
            echo "--- android/local.properties ---"
            cat android/local.properties
          else
            echo "(android/local.properties not present, will be generated by flutter build)"
          fi

      - name: Verify Gradle wrapper files
        run: |
          echo "--- gradle wrapper inventory ---"
          ls -la android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          echo "--- wrapper distributionUrl ---"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "OK: wrapper start scripts and jar are present in repo"

      # ---- debug：保留 Dart print + VM service，用于真机日志与 DevTools SQL 核验 ----
      - name: Build debug APK (log + DevTools)
        run: flutter build apk --debug

      - name: Stash debug APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk /tmp/app-debug.apk

      - name: Free disk after debug build
        run: |
          rm -rf build/app/intermediates build/app/tmp || true
          du -sh build /tmp/app-debug.apk 2>/dev/null || true
          df -h /

      # profile 包保留 Dart 侧 print 输出（release 会被 AOT 剥离），
      # 用于真机抓 [SEED]/[DB] 验收日志；release 包作为最终交付物。
      - name: Build profile APK (log-visible)
        run: flutter build apk --profile

      - name: Stash profile APK
        run: cp build/app/outputs/flutter-apk/app-profile.apk /tmp/app-profile.apk

      - name: Free disk after profile build
        run: |
          rm -rf build/app/intermediates build/app/tmp || true
          du -sh build /tmp/app-debug.apk /tmp/app-profile.apk 2>/dev/null || true
          df -h /

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk-profile
          path: /tmp/app-profile.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: study-tracker-apk-debug
          path: /tmp/app-debug.apk
          retention-days: 30
